name: aura-macos
# 给 macOS 的 Aura demo 单独发一个 release：tag 和 zip 文件名都叫 Aura-macos-<version>。
# 通过 gh 读取远端 Aura-macos-X.Y.Z tag，取最高版本的补丁号 +1，并写入 App。
# Aura demo 的版本独立于 FSPlayer 库的版本。
permissions:
  contents: write

# 所有分支共用版本序列，避免同时构建时选中同一个版本。
concurrency:
  group: aura-macos-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      archs:
        type: choice
        description: Architectures to build (universal by default)
        default: universal
        options:
          - universal
          - arm64
          - x86_64
        required: false
      publish:
        type: boolean
        description: Create the GitHub release (unchecked = build only, no tag)
        default: true
        required: false

jobs:
  build:
    name: build-aura-macos
    runs-on: macos-26
    # WORKFLOW_TOKEN 位于 Environments -> workflow，需要显式绑定才能读取。
    environment: workflow
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        # 拉完整历史 + tag，供 changelog 生成「上一个 Aura-macos tag..HEAD」的差异
        fetch-depth: 0
        fetch-tags: true

    # 这个 workflow 只在含 examples/macos 的分支上有效；被 cherry-pick 到其它分支时静默跳过
    - name: Check macOS project present
      run: |
        if [[ -d examples/macos/AuraPlayer.xcodeproj ]]; then
          echo "HAS_MACOS=1" >> "$GITHUB_ENV"
        else
          echo "HAS_MACOS=0" >> "$GITHUB_ENV"
          echo "::notice::examples/macos/AuraPlayer.xcodeproj is not present on ${GITHUB_REF_NAME}, nothing to build"
        fi

    # 内建 github.token 只能写 fsplayer；更新 tap 需要跨仓库凭据。
    # 提前检查，避免 Release 已发布后才发现 secret 缺失。
    - name: Check Homebrew push token
      if: ${{ env.HAS_MACOS == '1' && inputs.publish == true }}
      env:
        GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      run: |
        if [[ -z "$GH_TOKEN" ]]; then
          echo "::error::请在 Environments -> workflow 配置 WORKFLOW_TOKEN，并授予 debugly/homebrew-aura 的 Contents: write 权限"
          exit 1
        fi

    - name: Install tools
      if: ${{ env.HAS_MACOS == '1' }}
      run: brew install tree xcodegen

    # examples/macos/FSPlayer.xcodeproj 是个指向根目录 FSPlayer.xcodeproj 的 symlink，
    # 而后者由 xcodegen 从 FSPlayer.yml 生成且被 .gitignore —— 全新 checkout 上是悬空的。
    # AuraPlayer.xcworkspace 交叉引用了它，所以必须先生成，否则会报
    # "This Copy Files build phase contains a reference to a missing file"。
    - name: Generate FSPlayer project
      if: ${{ env.HAS_MACOS == '1' }}
      run: ./generate-proj.sh

    # 只装 macOS demo 实际用到的两个包，和 apple.yml 的 macOS 一致：
    # FSPlayer.framework 把 FFmpeg 静态链进去了（otool 只剩 asan），
    # 别照抄 aura-apk.yml 那份安卓长列表 —— 里面的 fontconfig 没有 macOS 预编译包，会 404。
    - name: Download Pre Compiled Dependencies
      if: ${{ env.HAS_MACOS == '1' }}
      run: |
        ./FFToolChain/main.sh install -p macos -l 'ass ffmpeg8'

    - name: Determine next version from GitHub tags
      if: ${{ env.HAS_MACOS == '1' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/scripts/next-aura-macos-version.sh "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

    # AuraPlayer 通过 workspace 里的 FSPlayer.xcodeproj 交叉引用直接依赖 FSPlayer.framework，
    # xcodebuild 会一并把它编出来，不需要先跑 build-framework.sh。
    #
    # 无证书构建：CI 上没有开发者证书，Aura demo 的 Release 配置用的是
    # Apple Development + Automatic 签名，直接编会卡在签名，所以显式关掉签名。
    - name: Build AuraPlayer.app
      if: ${{ env.HAS_MACOS == '1' }}
      env:
        ARCHS: ${{ inputs.archs }}
      run: |
        # ARCHS 要空格分隔。传逗号列表（arm64,x86_64）会让 framework target 编不出二进制，
        # 表现为 Copy Frameworks 阶段 "lipo: no input files specified"。
        case "$ARCHS" in
          universal) ARCH_LIST="arm64 x86_64" ;;
          *)          ARCH_LIST="$ARCHS" ;;
        esac
        # ARCH_LIST 给后面的 release notes 用：把 universal 还原成具体架构名。
        echo "ARCH_LIST=$ARCH_LIST" >> "$GITHUB_ENV"
        # 不覆盖 MACOSX_DEPLOYMENT_TARGET，让 FSPlayer.yml 里的 10.14 生效。
        xcodebuild -workspace examples/macos/AuraPlayer.xcworkspace \
          -scheme AuraPlayer \
          -configuration Release \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          MARKETING_VERSION="$VERSION" \
          ARCHS="$ARCH_LIST" ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          build

    - name: Verify app version
      if: ${{ env.HAS_MACOS == '1' }}
      run: |
        APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/AuraPlayer.app"
        test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
        APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
        test "$APP_VERSION" = "$VERSION" || { echo "::error::App version $APP_VERSION != $VERSION"; exit 1; }
        echo "version=$VERSION  tag=$TAG"

    # 从上一个 Aura-macos tag 到当前 HEAD 的提交生成 changelog，写进 release notes
    - name: Generate changelog
      if: ${{ env.HAS_MACOS == '1' }}
      run: |
        {
          echo "Aura demo app for macOS."
          echo ""
          echo "- Aura-macos-${VERSION}.zip (bundle id cn.debugly.AuraPlayer, app sandbox + hardened runtime)"
          echo "- Architectures: ${ARCH_LIST// /, }"
          echo "- Minimum macOS: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$RUNNER_TEMP/DerivedData/Build/Products/Release/AuraPlayer.app/Contents/Info.plist" 2>/dev/null || echo 'see Info.plist')"
          echo "- license: LGPL-2.1-or-later (see repo LICENSE)"
          echo ""
          if [[ -n "$PREV_TAG" ]]; then
            echo "## Changes since ${PREV_TAG}"
            echo ""
            git log --pretty=format:'- %s' "${PREV_TAG}..HEAD"
            echo ""
          fi
        } > "$RUNNER_TEMP/release-notes.md"
        echo "changelog written (${PREV_TAG:-no previous tag}..HEAD)"

    - name: Collect artifacts
      if: ${{ env.HAS_MACOS == '1' }}
      run: |
        APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/AuraPlayer.app"
        mkdir -p dist
        ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Aura-macos-${VERSION}.zip"
        ls -lh dist

    - name: Create draft release
      id: draft_release
      if: ${{ env.HAS_MACOS == '1' && inputs.publish == true }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # 只允许使用新 tag，确保失败清理不会删除此前已有的 tag。
        EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/${TAG}")
        if [[ -n "$EXISTING_TAG" ]]; then
          echo "::error::tag ${TAG} 已存在，停止发布"
          exit 1
        fi
        gh release create "${TAG}" --draft --target "${GITHUB_SHA}" -t "Aura macOS ${VERSION}" \
          --notes-file "$RUNNER_TEMP/release-notes.md" \
          "dist/Aura-macos-${VERSION}.zip"
        echo "created=true" >> "$GITHUB_OUTPUT"

    - name: Update Homebrew formula (homebrew-aura tap)
      id: homebrew
      if: ${{ env.HAS_MACOS == '1' && inputs.publish == true }}
      env:
        GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      run: |
        set -euo pipefail
        # Calculate SHA256 of the release zip
        RELEASE_ZIP="dist/Aura-macos-${VERSION}.zip"
        SHA256=$(shasum -a 256 "$RELEASE_ZIP" | awk '{print $1}')
        echo "SHA256: $SHA256"
        
        # Prepare formula content
        cat > /tmp/aura.rb << 'FORMULA'
        cask "aura" do
          version "VERSION_PLACEHOLDER"
          sha256 "SHA256_PLACEHOLDER"

          url "https://github.com/debugly/fsplayer/releases/download/Aura-macos-#{version}/Aura-macos-#{version}.zip"
          name "Aura"
          desc "Multi-platform video player based on ijkplayer"
          homepage "https://github.com/debugly/fsplayer"

          app "AuraPlayer.app"

          zap trash: [
            "~/Library/Preferences/cn.debugly.AuraPlayer.plist",
            "~/Library/Caches/cn.debugly.AuraPlayer",
            "~/Library/Application Support/CrashReporter/AuraPlayer*",
          ]
        end
        FORMULA
        
        sed -i "" "s/VERSION_PLACEHOLDER/${VERSION}/g; s/SHA256_PLACEHOLDER/${SHA256}/g" /tmp/aura.rb
        
        # Clone homebrew-aura, update formula, and push
        TAP_DIR=$(mktemp -d "$RUNNER_TEMP/homebrew-aura.XXXXXX")
        gh auth setup-git --hostname github.com
        git clone --depth 1 https://github.com/debugly/homebrew-aura.git "$TAP_DIR"
        cd "$TAP_DIR"
        mkdir -p Casks
        cp /tmp/aura.rb Casks/aura.rb
        
        # Configure git for push
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Commit and push if there are changes
        git add Casks/aura.rb
        if git diff --cached --quiet; then
          echo "No changes to formula"
        else
          git commit -m "chore: update aura to ${VERSION}"
          git push
          echo "Formula updated successfully"
        fi

    - name: Publish release after Homebrew update
      if: ${{ env.HAS_MACOS == '1' && inputs.publish == true }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release edit "$TAG" --draft=false

    # Homebrew 失败时保持 job 失败，同时撤销本次草稿及其 tag。
    - name: Clean up release after Homebrew failure
      if: ${{ failure() && steps.draft_release.outputs.created == 'true' && steps.homebrew.outcome == 'failure' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete "$TAG" --yes --cleanup-tag

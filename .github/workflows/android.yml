name: android-aar-apk
# release 步骤要用 workflow token 建 tag/release，默认 token 权限不一定够
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: publish beta edition
        default: true
        required: false
      publish:
        type: choice
        description: GitHub release (APK on the release page) / Maven Central / both
        default: release
        options:
          - release
          - maven-central
          - release+maven-central
        required: false
      abis:
        type: choice
        description: ABI list to build (default covers real devices)
        default: arm64-v8a,armeabi-v7a
        options:
          - arm64-v8a,armeabi-v7a
          - arm64-v8a,armeabi-v7a,x86,x86_64
        required: false
jobs:
  build:
    name: build-android-aar-apk
    runs-on: ubuntu-24.04
    # 发布用的凭据（Portal token + GPG）放在这个 environment 里，
    # job 不声明就读不到 secrets.MAVEN_CENTRAL_*/GPG_*；该 environment 没有保护规则，
    # 所以 build-only 的运行也不会被卡住。
    environment: fsplayer-maven

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          submodules: recursive

    # 这个 workflow 只在含 android/ 的分支（android）上有效；被 cherry-pick 到其它分支时静默跳过，不把 main 弄红
    - name: Check android project present
      run: |
        if [[ -d android ]]; then
          echo "HAS_ANDROID=1" >> "$GITHUB_ENV"
        else
          echo "HAS_ANDROID=0" >> "$GITHUB_ENV"
          echo "::notice::android/ is not present on ${GITHUB_REF_NAME}, nothing to build"
        fi

    - name: Prepare Beta Version
      if: ${{ env.HAS_ANDROID == '1' && inputs.beta == true }}
      run: |
        grep -m 1 VERSION_NAME= version.sh | awk -F = '{printf "VERSION=%s",$2}' | xargs > constants.env
        echo "RELEAE_DATE=$(TZ=UTC-8 date +'%y%m%d%H%M%S')" >> constants.env
        if [[ "$GITHUB_REF_NAME" == "master" || "$GITHUB_REF_NAME" == "main" ]]; then
          edition=beta
        else
          edition=$GITHUB_REF_NAME
        fi
        echo "TAG=$(grep "VERSION" constants.env | cut -d'=' -f2)-${edition}-$(grep "RELEAE_DATE" constants.env | cut -d'=' -f2)" >> constants.env
        cat constants.env

    - name: Prepare Normal Version
      if: ${{ env.HAS_ANDROID == '1' && inputs.beta == false }}
      run: |
        VERSION=$(grep -m 1 VERSION_NAME= version.sh | cut -d= -f2)
        printf 'VERSION=%s\nTAG=%s\n' "$VERSION" "$VERSION" > constants.env
        cat constants.env

    - name: Export Env
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: cardinalby/export-env-action@v2
      with:
        envFile: 'constants.env'

    - name: Set up JDK 17
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    # ubuntu-latest 镜像自带 Android SDK（$ANDROID_HOME，含 cmdline-tools），
    # 不再用 android-actions/setup-android@v3（它在 runner 上会失败）
    - name: Install Android platform / build-tools / NDK
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        test -d "$SDK" || { echo "::error::no Android SDK at $SDK"; exit 1; }
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
        sdkmanager --version
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
        sdkmanager --list_installed | head -20 || true

    - name: Download Pre Compiled Dependencies
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        ./FFToolChain/main.sh install -p android -l 'openssl3 opus bluray dav1d uavs3d smb2 soundtouch xml2 freetype fribidi harfbuzz unibreak fontconfig ass ffmpeg8'
        for cfg in FFToolChain/build/product/android/universal/ffmpeg/ffmpeg-*/include/libffmpeg/config.h; do
          echo "--- $cfg"
          grep -E 'FFMPEG_LICENSE|^#define CONFIG_(GPL|NONFREE)' "$cfg"
        done

    - name: Decode release keystore
      if: ${{ env.HAS_ANDROID == '1' }}
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [[ -z "$KEYSTORE_B64" ]]; then
          echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, the APK will be signed with the debug key"
          exit 0
        fi
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
        {
          echo "FS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
          echo "FS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "FS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
          echo "FS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
        } >> "$GITHUB_ENV"

    - name: Build AAR and APK
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        VCODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
        chmod +x android/gradlew
        cd android
        ./gradlew :ijkplayer:assembleRelease :demo:assembleRelease \
          -PabiFilters="${{ inputs.abis }}" \
          -PversionName="$VERSION" -PversionCode="$VCODE" \
          --no-daemon --stacktrace

    - name: Collect artifacts
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        mkdir -p dist
        cp android/ijkplayer/build/outputs/aar/ijkplayer-release.aar "dist/ijkplayer-${VERSION}.aar"
        cp android/demo/build/outputs/apk/release/demo-release.apk "dist/fsplayer-demo-${VERSION}.apk"
        LICENSE_FILE=$(ls COPYING.LGPLv2.1 COPYING.LGPLv3 2>/dev/null | head -1)
        cp "$LICENSE_FILE" dist/LICENSE
        (cd dist && sha256sum * > SHA256SUMS.txt)
        ls -l dist

    # artifact 是给 CI 自查用的（run 页面底部，需要登录 GitHub 才能下载）；
    # 手机上想直接装包，走 release：APK 会挂到 Release 资产上，浏览器点开就能下。
    - name: Upload artifacts
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: actions/upload-artifact@v7
      with:
        name: fsplayer-android-${{ env.VERSION }}
        path: dist/
        retention-days: 30

    - name: Upload Release Asset
      if: ${{ env.HAS_ANDROID == '1' && contains(inputs.publish, 'release') }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${TAG}" --target "${GITHUB_REF_NAME}" -t "👏👏 FSPlayer Android ${TAG}" \
          --notes "Android AAR + demo APK.

        - ijkplayer-${VERSION}.aar: the library (namespace com.debugly.fsplayer), FFmpeg statically linked into libfsplayer.so, libsmb2.so shipped alongside
        - fsplayer-demo-${VERSION}.apk: the demo app (applicationId com.debugly.aura)
        - ABIs: ${{ inputs.abis }}
        - FFmpeg product: ffmpeg8, LGPL version 2.1 or later, no --enable-gpl/--enable-nonfree
        - license: LGPL-2.1-or-later (see LICENSE); third-party components keep their own licenses (FFmpeg LGPL-2.1+, libsmb2 LGPL-2.1 as a separate .so, libass/FreeType/friBidi/HarfBuzz/OpenSSL/opus/dav1d/uavs3d/libbluray)" \
          "dist/ijkplayer-${VERSION}.aar" "dist/fsplayer-demo-${VERSION}.apk" dist/LICENSE dist/SHA256SUMS.txt

    # 发布 AAR 到 Maven Central（Central Portal）。需要 4 个 secret（值不进仓库）：
    #   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD = Portal 生成的 user token
    #   GPG_PRIVATE_KEY（ASCII-armored 私钥）/ GPG_PASSPHRASE
    # 上传后是「待发布部署」，需要在 Portal 上点一次 Release 才真正公开；
    # 想全自动就换成 :ijkplayer:publishAndReleaseToMavenCentral
    - name: Publish to Maven Central
      if: ${{ env.HAS_ANDROID == '1' && contains(inputs.publish, 'maven-central') }}
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [[ "${{ inputs.beta }}" == "true" ]]; then
          echo "::error::Maven Central 发布需要 beta=false（Beta 版本号带时间戳，Central 不接受重复/临时版本）"
          exit 1
        fi
        for k in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                 ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
          if [[ -z "${!k}" ]]; then
            echo "::error::$k is empty - add the MAVEN_CENTRAL_*/GPG_* repository secrets first"
            exit 1
          fi
        done
        chmod +x android/gradlew
        cd android
        ./gradlew :ijkplayer:publishToMavenCentral \
          -PabiFilters="${{ inputs.abis }}" \
          -PversionName="$VERSION" \
          --no-daemon --stacktrace
        echo "::notice::ijkplayer:${VERSION} 已上传 Maven Central，去 https://central.sonatype.com/publishing/deployments 点 Release" 

name: android-aar
# release 步骤要用 workflow token 建 tag/release，默认 token 权限不一定够
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: publish beta edition
        default: true
        required: false
      abis:
        type: choice
        description: ABI list to build (default covers real devices)
        default: arm64-v8a,armeabi-v7a
        options:
          - arm64-v8a,armeabi-v7a
          - arm64-v8a,armeabi-v7a,x86,x86_64
        required: false
jobs:
  build:
    name: build-android-aar
    runs-on: ubuntu-24.04
    # 发布用的凭据（Portal token + GPG）放在这个 environment 里，
    # job 不声明就读不到 secrets.MAVEN_CENTRAL_*/GPG_*；该 environment 没有保护规则，
    # 所以 build-only 的运行也不会被卡住。
    environment: fsplayer-maven

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          submodules: recursive

    # 这个 workflow 只在含 android/ 的分支（android）上有效；被 cherry-pick 到其它分支时静默跳过，不把 main 弄红
    - name: Check android project present
      run: |
        if [[ -d android ]]; then
          echo "HAS_ANDROID=1" >> "$GITHUB_ENV"
        else
          echo "HAS_ANDROID=0" >> "$GITHUB_ENV"
          echo "::notice::android/ is not present on ${GITHUB_REF_NAME}, nothing to build"
        fi

    - name: Prepare Beta Version
      if: ${{ env.HAS_ANDROID == '1' && inputs.beta == true }}
      run: |
        set -euo pipefail
        BASE_VERSION=$(grep -m 1 VERSION_NAME= version.sh | cut -d= -f2)
        # 版本号始终是 <base>-<分支名>-beta-<序号>，master 也一样
        # （1.1.1-master-beta-1、1.1.1-dev-1.1.1-beta-1），这样同一套
        # 解析规则就能从任意 tag 反推出分支和序号，分支名也不会在
        # master/main 与其它分支之间切换格式。
        edition=$GITHUB_REF_NAME
        BETA_NO=$(.github/scripts/next-beta-version.sh "$BASE_VERSION" "$edition")
        SHORT_SHA=$(git rev-parse --short=8 HEAD)
        {
          # VERSION 流到 -PversionName，即 AAR 的 Maven 坐标版本和 POM 里的
          # <version>，也是 dist/ijkplayer-<VERSION>.aar 的文件名。
          # 序号由 next-beta-version.sh 查已有 tag 自增得出，没有就 1 起步。
          echo "BASE_VERSION=$BASE_VERSION"
          echo "VERSION=${BASE_VERSION}-${edition}-beta-${BETA_NO}"
          echo "BETA_NO=$BETA_NO"
          echo "TAG=${BASE_VERSION}-${edition}-beta-${BETA_NO}"
        } > constants.env
        cat constants.env

    - name: Prepare Normal Version
      if: ${{ env.HAS_ANDROID == '1' && inputs.beta == false }}
      run: |
        set -euo pipefail
        BASE_VERSION=$(grep -m 1 VERSION_NAME= version.sh | cut -d= -f2)
        {
          echo "BASE_VERSION=$BASE_VERSION"
          echo "VERSION=$BASE_VERSION"
          echo "SHORT_SHA=$(git rev-parse --short=8 HEAD)"
          echo "TAG=$BASE_VERSION"
        } > constants.env
        cat constants.env

    - name: Export Env
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: cardinalby/export-env-action@v2
      with:
        envFile: 'constants.env'

    - name: Set up JDK 17
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    # ubuntu-latest 镜像自带 Android SDK（$ANDROID_HOME，含 cmdline-tools），
    # 不再用 android-actions/setup-android@v3（它在 runner 上会失败）
    - name: Install Android platform / build-tools / NDK
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        test -d "$SDK" || { echo "::error::no Android SDK at $SDK"; exit 1; }
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
        sdkmanager --version
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
        sdkmanager --list_installed | head -20 || true

    - name: Download Pre Compiled Dependencies
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        ./FFToolChain/main.sh install -p android -l 'openssl3 opus bluray dav1d uavs3d smb2 soundtouch xml2 freetype fribidi harfbuzz unibreak fontconfig ass ffmpeg8'
        for cfg in FFToolChain/build/product/android/universal/ffmpeg/ffmpeg-*/include/libffmpeg/config.h; do
          echo "--- $cfg"
          grep -E 'FFMPEG_LICENSE|^#define CONFIG_(GPL|NONFREE)' "$cfg"
        done

    - name: Build AAR
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        # 这里只出 AAR。demo APK 由 aura-apk.yml 单独发布（它读 demo 模块的
        # versionName，并产出 Aura-android-<version> 那个 release），所以本
        # workflow 不再 assembleRelease demo，也就不需要 versionCode —— 那是
        # APK 覆盖安装用的概念，AAR 只认 Maven 坐标版本。
        echo "building AAR version=$VERSION"
        chmod +x android/gradlew
        cd android
        ./gradlew :ijkplayer:assembleRelease \
          -PabiFilters="${{ inputs.abis }}" \
          -PversionName="$VERSION" \
          --no-daemon --stacktrace

    - name: Collect artifacts
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        mkdir -p dist
        cp android/ijkplayer/build/outputs/aar/ijkplayer-release.aar "dist/ijkplayer-${VERSION}.aar"
        LICENSE_FILE=$(ls COPYING.LGPLv2.1 COPYING.LGPLv3 2>/dev/null | head -1)
        cp "$LICENSE_FILE" dist/LICENSE
        (cd dist && sha256sum * > SHA256SUMS.txt)
        ls -l dist

    # artifact 是给 CI 自查用的（run 页面底部，需要登录 GitHub 才能下载）。
    # 要装到手机上的 demo APK 走另一个 workflow：aura-apk.yml 发 Aura-android-<version>。
    - name: Upload artifacts
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: actions/upload-artifact@v7
      with:
        name: fsplayer-android-${{ env.VERSION }}
        path: dist/
        retention-days: 30

    - name: Upload Release Asset
      if: ${{ env.HAS_ANDROID == '1' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NOTES="Android AAR.

        - ABIs: ${{ inputs.abis }}
        - note: the library (namespace com.debugly.fsplayer), FFmpeg statically linked into libfsplayer.so, libsmb2.so shipped alongside
        - commit: \`${SHORT_SHA}\` on ${GITHUB_REF_NAME}
        - license: LGPL version 2.1 or later, no --enable-gpl/--enable-nonfree
        - third-party: FFmpeg 8; OpenSSL 3; libass; FreeType; FriBidi; HarfBuzz; fontconfig; libunibreak; libxml2; libopus; libbluray; dav1d; libuavs3d; SoundTouch; libsmb2

        The demo APK is published separately as Aura-android-<version>."

        ASSETS=("dist/ijkplayer-${VERSION}.aar" dist/LICENSE dist/SHA256SUMS.txt)

        # 序号是在本次运行开始时算的，所以同一提交重跑会得到同一个 TAG。
        # 直接 gh release create 会撞 "a release with the same tag name already
        # exists" 并让整个 job 失败，后面的 Maven Central 发布被连带跳过。
        # 所以先看 release 在不在：在就只覆盖资产，不在才创建。
        if gh release view "${TAG}" >/dev/null 2>&1; then
          echo "::notice::release ${TAG} already exists, replacing its assets"
          gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          gh release edit "${TAG}" --title "FSPlayer Android ${TAG}" --notes "${NOTES}"
        else
          gh release create "${TAG}" --target "${GITHUB_REF_NAME}" \
            -t "FSPlayer Android ${TAG}" --notes "${NOTES}" "${ASSETS[@]}"
        fi

    # 发布 AAR 到 Maven Central（Central Portal）。需要 4 个 secret（值不进仓库）：
    #   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD = Portal 生成的 user token
    #   GPG_PRIVATE_KEY（ASCII-armored 私钥）/ GPG_PASSPHRASE
# 用 publishAndReleaseToMavenCentral 而不是 publishToMavenCentral：后者只上传成
# 「待发布部署」，还得去 Portal 手动点一次 Release 才真正对外可见。
    - name: Publish to Maven Central
      if: ${{ env.HAS_ANDROID == '1' }}
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        for k in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                 ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
          if [[ -z "${!k}" ]]; then
            echo "::error::$k is empty - add the MAVEN_CENTRAL_*/GPG_* repository secrets first"
            exit 1
          fi
        done
        chmod +x android/gradlew
        cd android
        ./gradlew :ijkplayer:publishAndReleaseToMavenCentral \
          -PabiFilters="${{ inputs.abis }}" \
          -PversionName="$VERSION" \
          --no-daemon --stacktrace
        echo "::notice::ijkplayer:${VERSION} 已发布到 Maven Central，同步通常需要几分钟"

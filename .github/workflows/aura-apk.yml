name: aura-apk
# 给 Aura APK 单独发一个 release：tag 和 APK 文件名都叫 Aura-android-<version>。
# 从 GitHub 上已发布的 Aura Android 版本取最大值，构建前递增补丁号。
permissions:
  contents: write

concurrency:
  group: aura-android-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      abis:
        type: choice
        description: ABI list to build (default arm64-v8a only for quick device testing)
        default: arm64-v8a
        options:
          - arm64-v8a
          - arm64-v8a,armeabi-v7a
          - arm64-v8a,armeabi-v7a,x86,x86_64
        required: false

jobs:
  build:
    name: build-aura-apk
    # pin ubuntu-24.04：ubuntu-latest 将在 2026-10-19 迁移到 Ubuntu 26，自带 Android SDK 环境可能变化
    runs-on: ubuntu-24.04
    # 复用 fsplayer-maven environment 里的 keystore secret（正式签名）；该 environment
    # 没有保护规则，不会卡住运行。没配 keystore 就退回 debug 签名。
    environment: fsplayer-maven

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          submodules: recursive
          # 拉完整历史 + tag，供 changelog 生成「上一个 Aura tag..HEAD」的差异
          fetch-depth: 0
          fetch-tags: true

    # 这个 workflow 只在含 examples/android/ 的分支上有效；被 cherry-pick 到其它分支时静默跳过
    - name: Check android project present
      run: |
        if [[ -f examples/android/settings.gradle && -f ijkmedia/wrapper/android/fsplayer/build.gradle ]]; then
          echo "HAS_ANDROID=1" >> "$GITHUB_ENV"
        else
          echo "HAS_ANDROID=0" >> "$GITHUB_ENV"
          echo "::notice::Aura or its local FSPlayer SDK is missing on ${GITHUB_REF_NAME}, nothing to build"
        fi

    - name: Set up JDK 17
      if: ${{ env.HAS_ANDROID == '1' }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    # ubuntu-latest 镜像自带 Android SDK（$ANDROID_HOME，含 cmdline-tools）
    - name: Install Android platforms, build-tools, NDK and CMake
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        test -d "$SDK" || { echo "::error::no Android SDK at $SDK"; exit 1; }
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
        sdkmanager --version
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" \
          "ndk;27.3.13750724" "cmake;3.22.1"
        sdkmanager --list_installed | head -20 || true

    - name: Download Pre Compiled Dependencies
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        ./FFToolChain/main.sh install -p android -l 'ass yuv ffmpeg'

    - name: Decode release keystore
      if: ${{ env.HAS_ANDROID == '1' }}
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [[ -z "$KEYSTORE_B64" ]]; then
          echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, the APK will be signed with the debug key"
          exit 0
        fi
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
        {
          echo "FS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
          echo "FS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "FS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
          echo "FS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
        } >> "$GITHUB_ENV"

    - name: Determine Aura version
      if: ${{ env.HAS_ANDROID == '1' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/next-aura-android-version.sh >> "$GITHUB_ENV"

    - name: Build APK
      if: ${{ env.HAS_ANDROID == '1' }}
      working-directory: examples/android
      run: |
        ./gradlew :aura:assembleRelease \
          -PabiFilters="${{ inputs.abis }}" \
          -PversionName="$VERSION" -PversionCode="$VERSION_CODE" \
          --no-daemon --stacktrace

    - name: Verify APK version
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        set -euo pipefail
        APK=examples/android/aura/build/outputs/apk/release/aura-release.apk
        BADGING=$("$ANDROID_HOME"/build-tools/35.0.0/aapt dump badging "$APK")
        APK_VERSION=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
        APK_CODE=$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")
        if [[ "$APK_VERSION" != "$VERSION" || "$APK_CODE" != "$VERSION_CODE" ]]; then
          echo "::error::APK version $APK_VERSION ($APK_CODE) differs from $VERSION ($VERSION_CODE)"
          exit 1
        fi
        echo "version=$VERSION  tag=Aura-android-$VERSION"

    # 从上一个 Aura tag 到当前 HEAD 的提交生成 changelog，写进 release notes
    - name: Generate changelog
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        {
          echo "Aura APK."
          echo ""
          echo "- Aura-android-${VERSION}.apk (applicationId com.debugly.aura)"
          echo "- ABIs: ${{ inputs.abis }}"
          echo "- license: LGPL-2.1-or-later (see repo LICENSE)"
          echo ""
          if [[ -n "$PREV_TAG" ]]; then
            echo "## Changes since ${PREV_TAG}"
            echo ""
            git log --pretty=format:'- %s' "${PREV_TAG}..HEAD"
            echo ""
          fi
        } > "$RUNNER_TEMP/release-notes.md"
        echo "changelog written (${PREV_TAG:-no previous tag}..HEAD)"

    - name: Collect artifacts
      if: ${{ env.HAS_ANDROID == '1' }}
      run: |
        mkdir -p dist
        cp examples/android/aura/build/outputs/apk/release/aura-release.apk "dist/Aura-android-${VERSION}.apk"
        ls -l dist

    - name: Upload Release Asset
      if: ${{ env.HAS_ANDROID == '1' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${TAG}" --latest=false --target "${GITHUB_REF_NAME}" -t "Aura Android ${VERSION}" \
          --notes-file "$RUNNER_TEMP/release-notes.md" \
          "dist/Aura-android-${VERSION}.apk"

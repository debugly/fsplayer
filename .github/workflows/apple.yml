name: apple-xcframework

on:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: publish beta edition
        default: true
        required: false
jobs:
  build:
    name: build-apple-xcframework
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
          submodules: recursive
    - name: Prepare Beta Version
      if: ${{ inputs.beta == true }}
      run: |
        grep -m 1 VERSION_NAME= version.sh | awk -F = '{printf "VERSION=%s",$2}' | xargs > constants.env
        echo "RELEAE_DATE=$(TZ=UTC-8 date +'%y%m%d%H%M%S')" >> constants.env
        branch=$(git branch --show-current)
        if [[ "$branch" == "master" || "$branch" == "main" ]]; then
          edition=beta
        else
          edition=$branch
        fi
        echo "TAG="$(grep "VERSION" constants.env | cut -d'=' -f2)"-${edition}-"$(grep "RELEAE_DATE" constants.env | cut -d'=' -f2) >> constants.env
        cat constants.env
    - name: Prepare Normal Version
      if: ${{ inputs.beta == false }}
      run: |
        grep -m 1 VERSION_NAME= version.sh | awk -F = '{printf "TAG=%s",$2}' | xargs > constants.env
        cat constants.env
    - name: Export Env
      uses: cardinalby/export-env-action@v2
      with:
        envFile: 'constants.env'
    - run: brew install tree xcodegen
    - name: Download Pre Compiled Dependencies
      run: |
        ./FFToolChain/main.sh install -p ios -l 'ass ffmpeg8'
        ./FFToolChain/main.sh install -p macos -l 'ass ffmpeg8'
        ./FFToolChain/main.sh install -p tvos -l 'ass ffmpeg8'
    - name: Build iOS Framework
      run:  ./examples/ios/build-framework.sh
    - name: Build macOS Framework      
      run: ./examples/macos/build-framework.sh
    - name: Build tvOS Framework
      run: ./examples/tvos/build-framework.sh
    - name: Make xcframework
      run: ./examples/xcframewrok/make-xcframework.sh
    - name: Make podspec
      run: ./examples/xcframewrok/make-podspec.sh "${{ env.TAG }}"
    - name: Make Distribution Resources
      run: |
        package_dist() {
          local name="$1"
          local xcf_path="$2"
          local temp_dir="dist/${name}"

          mkdir -p "$temp_dir"
          cp CHANGELOG.md README.md "$temp_dir/"
          cp COPYING.LGPLv3 "$temp_dir/LICENSE"
          cp -pPR "$xcf_path" "$temp_dir/"
          (cd "$temp_dir" && zip -ryq "../${name}.zip" ./*)
          rm -rf "$temp_dir"
        }

        mkdir -p dist
        package_dist "FSPlayer" "examples/xcframewrok/FSPlayer.xcframework"
        package_dist "FSPlayer-iOS" "examples/xcframewrok/ios/FSPlayer.xcframework"
        package_dist "FSPlayer-macOS" "examples/xcframewrok/macos/FSPlayer.xcframework"
        package_dist "FSPlayer-tvOS" "examples/xcframewrok/tvos/FSPlayer.xcframework"
    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        branch=$(git branch --show-current)
        gh release create ${{ env.TAG }} --target $branch -t "👏👏 FSPlayer ${{ env.TAG }}" \
          dist/FSPlayer.zip dist/FSPlayer-iOS.zip dist/FSPlayer-macOS.zip dist/FSPlayer-tvOS.zip \
          examples/xcframewrok/FSPlayer.spec.json examples/xcframewrok/FSPlayer-iOS.spec.json examples/xcframewrok/FSPlayer-macOS.spec.json examples/xcframewrok/FSPlayer-tvOS.spec.json
# 上游 ijkplayer 遗留的 VERSION_NAME/VERSION_CODE/GROUP 与 POM_* 属性已移除：
# 它们指向 Bilibili / tv.danmaku.ijk.media，会被 maven-publish 插件自动追加进 POM，
# 让发布出来的元数据混进上游的作者和旧坐标。本 fork 的坐标与 POM 元数据统一在
# ijkplayer/build.gradle 的 mavenPublishing {} 里维护，版本由 -PversionName 传入。

android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
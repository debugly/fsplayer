plugins {
    id 'com.android.application'
}

android {
    // 复刻自 ijkplayer-example，所以 R 的包名保持 tv.danmaku.ijk.media.example；
    // applicationId 仍用 fsplayer 的，方便 adb 脚本继续按老包名拉起。
    namespace 'tv.danmaku.ijk.media.example'
    compileSdk 35

    defaultConfig {
        applicationId "com.debugly.fsplayer.demo"
        minSdk 24
        targetSdk 35
        // Aura 演示包版本：默认 0.1.4 / 104，aura-apk workflow 直接读这里（不再读 version.sh）；
        // android.yml（AAR/Maven）仍通过 -PversionName/-PversionCode 覆盖成 version.sh 的版本。
        versionCode((project.findProperty("versionCode") ?: 104).toInteger())
        versionName(project.findProperty("versionName") ?: "0.1.4")
    }

    signingConfigs {
        release {
            // CI 用 secrets 解码出 keystore 并导出这三个环境变量；本地没有就退回 debug 签名
            def ks = System.getenv("FS_KEYSTORE_FILE")
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv("FS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FS_KEY_ALIAS")
                keyPassword System.getenv("FS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("FS_KEYSTORE_FILE") != null
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':ijkplayer')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.squareup:otto:1.3.8'
}

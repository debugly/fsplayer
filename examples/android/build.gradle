// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep Aura's SDK build artifacts separate from standalone AAR builds.
project(':fsplayer') {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('fsplayer'))
    plugins.withId('com.android.library') {
        android.externalNativeBuild.cmake.buildStagingDirectory = rootProject.file('build/fsplayer-native')
    }
}
